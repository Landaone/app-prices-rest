schema: spec-driven

context: |
  Project: app-prices-rest — a Java 11 / Spring Boot 2.4.5 REST API (Maven build) that resolves
  the applicable price for a brand/product at a given point in time from a single PRICES table
  (H2 in-memory, Flyway-migrated). See docs/base-standards.md for cross-cutting AI-agent rules,
  docs/backend-standards.md for stack/architecture/testing conventions (including a documented
  Known Risks section — do not "fix" those defects unless a change specifically asks to),
  docs/api-spec.yml for the current API contract, and docs/data-model.md for the schema and
  price-resolution business rule. There is no frontend (docs/frontend-standards.md is marked Not
  Applicable) — never introduce frontend, browser, Playwright, or E2E requirements for this repo.
  For backend implementation work, prefer the java-backend-developer canonical agent
  (ai-specs/agents/java-backend-developer.md), added during adoption because the pre-existing
  backend-developer agent targets an unrelated TypeScript/Express/Prisma stack, not this
  repository's actual Java/Spring Boot stack. ai-specs/skills/ holds workflow guidance (commit,
  enrich-us, explain, update-docs, etc.) — load the matching skill when a request matches it, per
  docs/base-standards.md section 4.

rules:
  proposal:
    - Ground every proposal in the actual Java, Spring Boot, JPA, and Flyway stack described in
      docs/backend-standards.md — never assume Node.js, TypeScript, Prisma, or a frontend.
    - Reference the real single-table PRICES schema from docs/data-model.md, not an invented
      domain model.
  specs:
    - Keep spec deltas consistent with the existing GET /api/price contract in docs/api-spec.yml
      unless the change explicitly redefines it.
  design:
    - Note any interaction with the Known Risks documented in docs/backend-standards.md (the
      HttpErrorHandler exception-handler mismatch, the NoPriceFoundException message typo, the
      migration timestamp format, and unvalidated applicationDate) when a change touches that
      code, rather than silently working around them.
  tasks:
    - Include a task step to run the test suite (mvn test, or mvn -o test once the local Maven
      cache is warm) and to update the relevant docs markdown file alongside any code change.

operations:
  apply:
    guidance:
      - Use the system mvn, not ./mvnw — the Maven wrapper is currently broken in this
        repository (see docs/backend-standards.md).
  archive:
    guidance:
      - Confirm docs/api-spec.yml and docs/data-model.md still match the implementation before
        archiving.
