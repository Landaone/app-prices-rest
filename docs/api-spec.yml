openapi: 3.0.0
info:
  title: Prices REST API
  description: |
    REST API that resolves the applicable price for a product, brand, and point in time,
    selecting among overlapping price-list windows by priority.

    This is a small Spring Boot service with a single read endpoint backed by an H2
    in-memory database, seeded via Flyway migrations.
  version: 0.0.1-SNAPSHOT
  contact:
    name: llandaeta
  license:
    name: ISC

servers:
  - url: http://localhost:8080
    description: Local development server (Spring Boot default port; no override configured)

paths:
  /api/price:
    get:
      summary: Get the applicable price
      description: |
        Retrieve the price that applies to a given brand, product, and date/time. When more
        than one price-list window overlaps the requested date, the window with the highest
        `priority` wins (src/main/java/com/llandaeta/prices/core/services/impl/PriceServiceImpl.java:26,
        src/main/java/com/llandaeta/prices/db/repositories/PriceRepository.java:13 —
        `findFirstBy...OrderByPriorityDesc`).
      tags:
        - Price
      parameters:
        - in: query
          name: brandId
          required: true
          schema:
            type: integer
          description: Brand identifier (src/main/java/com/llandaeta/prices/rest/controllers/PriceController.java:24)
        - in: query
          name: productId
          required: true
          schema:
            type: integer
          description: Product identifier (src/main/java/com/llandaeta/prices/rest/controllers/PriceController.java:25)
        - in: query
          name: applicationDate
          required: true
          schema:
            type: string
            example: "2020-06-14 10:00:00"
          description: |
            Date/time the price should apply at, in the fixed format `yyyy-MM-dd HH:mm:ss`
            (src/main/java/com/llandaeta/prices/rest/controllers/PriceController.java:28). Not
            ISO-8601; a value in a different format fails `LocalDateTime.parse` with a 500
            response — there is no `HttpException` mapping for a parse failure (see Known
            Risks and Defects below).
      responses:
        '200':
          description: Successfully resolved the applicable price
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceModel'
        '404':
          description: No price found for the given brand, product, and date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: |
            Internal server error — including a malformed `applicationDate` (unparseable by
            `DateTimeFormatter.ofPattern("yyyy-MM-dd HH:mm:ss")`) or a missing/malformed
            required query parameter, since none of these are mapped to a 4xx `HttpException`
            (src/main/java/com/llandaeta/prices/rest/controllers/PriceController.java:23-31).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    PriceModel:
      type: object
      description: |
        Response body for the resolved price (src/main/java/com/llandaeta/prices/core/model/PriceModel.java).
      properties:
        brandId:
          type: integer
          description: Brand identifier
        startDate:
          type: string
          format: date-time
          description: Start of the price-list window's validity period
        endDate:
          type: string
          format: date-time
          description: End of the price-list window's validity period
        productId:
          type: integer
          description: Product identifier
        priceList:
          type: integer
          description: Identifier of the price list this price belongs to (`PRICE_LIST` column)
        priority:
          type: integer
          description: Priority used to break ties among overlapping windows — higher wins
        price:
          type: number
          format: double
          description: The resolved price amount
        curr:
          type: string
          description: ISO currency code (e.g. "EUR")
      required:
        - brandId
        - startDate
        - endDate
        - productId
        - priceList
        - priority
        - price
        - curr

    ErrorResponse:
      type: object
      description: |
        Uniform error body produced by the global exception handler
        (src/main/java/com/llandaeta/prices/rest/exception/HttpErrorHandler.java,
        src/main/java/com/llandaeta/prices/rest/dto/Error.java).
      properties:
        httpcode:
          type: integer
          description: HTTP status code repeated in the body
        message:
          type: string
          description: Error message
      required:
        - httpcode
        - message

tags:
  - name: Price
    description: Operations for resolving the applicable price of a product

x-known-risks-and-defects:
  - id: unhandled-exception-handler-parameter-type-mismatch
    description: |
      `HttpErrorHandler.unhandledExceptions` is declared with `@ExceptionHandler(Exception.class)`
      but its parameter type is `HttpException`, a subtype. Spring MVC only invokes an
      `@ExceptionHandler` method for an exception assignable to its declared parameter type, so a
      non-`HttpException` (for example a `DateTimeParseException` from a malformed
      `applicationDate`, or a missing required query parameter) is not actually handled by this
      method despite the annotation's broader intent — it falls through to the framework's
      default error handling instead of this application's uniform `ErrorResponse` body.
    citation: src/main/java/com/llandaeta/prices/rest/exception/HttpErrorHandler.java:24-25
  - id: no-covering-test-for-repository-query-method
    description: |
      `PriceRepository.findFirstByBrandIdAndProductIdAndStartDateIsLessThanEqualAndEndDateGreaterThanEqualOrderByPriorityDesc`
      — the derived query that implements the priority tie-break — has no test that exercises the
      actual Spring Data JPA query against the database; `PriceServiceImplTest` mocks the
      repository (`@MockBean`) rather than exercising it, and `PriceControllerTest` runs through
      `@SpringBootTest` but only against the Flyway-seeded fixture data, not against edge cases in
      the derived query itself (multiple overlapping windows with different priorities beyond
      the seeded rows).
    citation: src/main/java/com/llandaeta/prices/db/repositories/PriceRepository.java:13
