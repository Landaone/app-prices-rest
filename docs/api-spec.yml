openapi: 3.0.0
info:
  title: app-prices-rest API
  description: |
    REST API for `app-prices-rest`, a Spring Boot service that resolves which price applies to a
    product of a brand at a given instant.

    Price rows overlap in time. When more than one row is valid for the requested instant, the row
    with the **highest `priority`** is returned. That rule lives entirely in the derived repository
    query `findFirstBy...OrderByPriorityDesc`
    (`src/main/java/com/llandaeta/prices/db/repositories/PriceRepository.java:13`).

    The validity window is **inclusive at both ends** (`StartDateIsLessThanEqual`,
    `EndDateGreaterThanEqual`, same line).

    This service exposes exactly one endpoint. There is no authentication, no pagination, and no
    write operation.
  version: 0.0.1-SNAPSHOT
  contact:
    name: app-prices-rest

servers:
  - url: http://localhost:8080
    description: Local development server (Spring Boot default port; no server.port is set in application.yaml)

paths:
  /api/price:
    get:
      summary: Resolve the applicable price
      description: |
        Returns the price that applies to `productId` of `brandId` at `applicationDate`.

        Implemented by `PriceController.searchPriceForBrandTime`
        (`src/main/java/com/llandaeta/prices/rest/controllers/PriceController.java:23`), which
        delegates to `PriceService.searchPriceToApply`
        (`src/main/java/com/llandaeta/prices/core/services/PriceService.java:10`).

        Note that the controller passes `applicationDate` as **both** the start and the end bound
        of the query (`PriceController.java:30`), so a single instant is matched against each
        row's `[startDate, endDate]` window.
      operationId: searchPriceForBrandTime
      tags:
        - price
      parameters:
        - name: brandId
          in: query
          required: true
          description: Brand identifier. Required; the controller declares no default.
          schema:
            type: integer
            format: int32
          example: 1
        - name: productId
          in: query
          required: true
          description: Product identifier. Required; the controller declares no default.
          schema:
            type: integer
            format: int32
          example: 35455
        - name: applicationDate
          in: query
          required: true
          description: |
            The instant to resolve the price for.

            **Format is `yyyy-MM-dd HH:mm:ss`, with a space separator — not ISO-8601.** The
            controller parses it with an explicit `DateTimeFormatter.ofPattern`
            (`PriceController.java:28`), so a `T` separator such as `2020-06-14T10:00:00` will not
            parse. When sending this over HTTP the space must be URL-encoded (`%20` or `+`).
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$'
          example: "2020-06-14 10:00:00"
      responses:
        '200':
          description: The applicable price was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceModel'
              examples:
                basePrice:
                  summary: Base price, priority 0
                  description: >-
                    Matches the first seeded row of `V1_create_tables.sql`. Asserted by
                    `PriceControllerTest.shouldReturnSuccessful_PriceToApplyForTheDate20200614_100000`.
                  value:
                    brandId: 1
                    startDate: "2020-06-14T00:00:00"
                    endDate: "2020-12-31T23:59:59"
                    productId: 35455
                    priceList: 1
                    priority: 0
                    price: 35.5
                    curr: "EUR"
                promotionWins:
                  summary: Overlapping window, higher priority wins
                  description: >-
                    At 16:00 on 2020-06-14 both price list 1 (priority 0) and price list 2
                    (priority 1) are valid; priority 1 is returned. Asserted by
                    `PriceControllerTest.shouldReturnSuccessful_PriceToApplyForTheDate20200614_160000`.
                  value:
                    brandId: 1
                    startDate: "2020-06-14T15:00:00"
                    endDate: "2020-06-14T18:30:00"
                    productId: 35455
                    priceList: 2
                    priority: 1
                    price: 25.45
                    curr: "EUR"
        '404':
          description: |
            No price row matches the given brand, product, and instant.

            Raised as `NoPriceFoundException`
            (`src/main/java/com/llandaeta/prices/core/services/impl/PriceServiceImpl.java:30`),
            which extends `NotFoundException` and therefore carries `HttpStatus.NOT_FOUND`
            (`src/main/java/com/llandaeta/prices/core/exception/NotFoundException.java:9`). Mapped
            to the response body by `HttpErrorHandler.handleHttpError`
            (`src/main/java/com/llandaeta/prices/rest/exception/HttpErrorHandler.java:16`).

            No automated test currently covers this path — see
            `docs/backend-standards.md`, "Coverage Gaps".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                httpcode: 404
                message: "No  price found to the brand"

components:
  schemas:
    PriceModel:
      type: object
      description: |
        The API-facing price model
        (`src/main/java/com/llandaeta/prices/core/model/PriceModel.java`). It is produced from
        `PriceEntity` by `PriceEntityModelConverter`
        (`src/main/java/com/llandaeta/prices/core/converters/PriceEntityModelConverter.java:12`).

        Note that the entity's `id` is **not** carried into this model, so the identifier is never
        exposed over HTTP. All eight fields below are primitives or `String`, so none is nullable
        in practice except `curr`.
      properties:
        brandId:
          type: integer
          format: int32
          description: Brand identifier.
          example: 1
        startDate:
          type: string
          format: date-time
          description: >-
            Inclusive start of the validity window. Serialized by Jackson from a `LocalDateTime`,
            so it appears in ISO-8601 form with a `T` separator — note this differs from the
            `applicationDate` request parameter's format.
          example: "2020-06-14T00:00:00"
        endDate:
          type: string
          format: date-time
          description: Inclusive end of the validity window.
          example: "2020-12-31T23:59:59"
        productId:
          type: integer
          format: int32
          description: Product identifier.
          example: 35455
        priceList:
          type: integer
          format: int32
          description: Identifier of the price list (tariff) the returned rate belongs to.
          example: 1
        priority:
          type: integer
          format: int32
          description: >-
            Disambiguator for overlapping windows; the highest value wins. Returned for
            transparency about which rule was applied.
          example: 0
        price:
          type: number
          format: double
          description: >-
            The price to apply. Declared as a Java `double` while the column is `DECIMAL(4,2)`
            (`src/main/resources/db/migration/V1_create_tables.sql:12`), which caps any value at
            99.99. See `docs/backend-standards.md`, defect D4.
          example: 35.5
        curr:
          type: string
          description: Currency code. Stored as `VARCHAR(3)`; every seeded row uses `EUR`.
          example: "EUR"
    Error:
      type: object
      description: |
        Error response body
        (`src/main/java/com/llandaeta/prices/rest/dto/Error.java`), built by `HttpErrorHandler`.
      properties:
        httpcode:
          type: integer
          format: int32
          description: >-
            The HTTP status code, repeated in the body. The field name is all lowercase with no
            separator — `httpcode`, not `httpCode`.
          example: 404
        message:
          type: string
          description: The exception message, passed through unchanged.
          example: "No  price found to the brand"

# ---------------------------------------------------------------------------
# Deliberately not specified
#
# No response is documented for a malformed `applicationDate`. The controller parses the value
# with no surrounding validation (`PriceController.java:28`), so a bad value raises
# `DateTimeParseException` — which is not an `HttpException` and therefore falls to the generic
# handler in `HttpErrorHandler`. That handler is annotated `@ExceptionHandler(Exception.class)`
# but declares an `HttpException` parameter (`HttpErrorHandler.java:24-25`), so it cannot bind a
# `DateTimeParseException`. The status and body a client actually receives are not determined by
# this codebase, and inventing one here would document a contract the service does not honour.
# Tracked as defects D1 and D2 in `docs/backend-standards.md`.
# ---------------------------------------------------------------------------
