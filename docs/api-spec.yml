openapi: 3.0.0
info:
  title: app-prices-rest API
  description: |
    REST API that resolves the applicable price for a brand, product, and point in time,
    from a versioned H2 price list managed by Flyway.

    This repository exposes **exactly one** endpoint. Verified by inspection of
    `src/main/java/com/llandaeta/prices/rest/controllers/PriceController.java` (the only
    `@RestController` in the codebase) and by `find src -name "*Controller.java"`, which returns
    a single file.

    ## Error contract — read before integrating

    This API does **not** return a single consistent error shape today. Two different shapes are
    actually produced, depending on which exception is thrown:

    - Errors that originate from an `HttpException` subtype (currently only "no price found",
      HTTP 404) are converted to the project's custom `Error` schema by
      `HttpErrorHandler.handleHttpError`
      (`src/main/java/com/llandaeta/prices/rest/exception/HttpErrorHandler.java:15-22`).
    - Every other error (malformed `applicationDate`, a non-numeric `brandId`/`productId`, an
      unsupported HTTP method, or any other uncaught exception) falls through to Spring Boot's
      own default error page and returns its default Whitelabel JSON body instead, because
      `HttpErrorHandler.unhandledExceptions` (annotated `@ExceptionHandler(Exception.class)` but
      declaring its parameter as `HttpException`, `HttpErrorHandler.java:24-25`) can never
      actually receive a non-`HttpException` exception. This was verified empirically against a
      locally running instance of this exact code on 2026-08-19 (see the `SpringDefaultError`
      schema and the per-response documentation below). This is a known defect, documented here
      accurately rather than fixed — see
      [`docs/backend-standards.md`](./backend-standards.md#known-risks-and-defects).

  version: 0.0.1-SNAPSHOT
  contact:
    name: llandaeta
  license:
    name: Unspecified

servers:
  - url: http://localhost:8080
    description: Local development server (embedded Tomcat, default port)

paths:
  /api/price:
    get:
      summary: Get the applicable price
      description: |
        Returns the price row with the highest `priority` among rows matching `brandId` and
        `productId` whose validity window `[startDate, endDate]` contains `applicationDate`
        (both bounds inclusive).

        Implemented by
        `PriceController.searchPriceForBrandTime`
        (`src/main/java/com/llandaeta/prices/rest/controllers/PriceController.java:23-31`), which
        delegates to
        `PriceService.searchPriceToApply`
        (`src/main/java/com/llandaeta/prices/core/services/PriceService.java:10`), backed by the
        derived query
        `PriceRepository.findFirstByBrandIdAndProductIdAndStartDateIsLessThanEqualAndEndDateGreaterThanEqualOrderByPriorityDesc`
        (`src/main/java/com/llandaeta/prices/db/repositories/PriceRepository.java:13`).
      tags:
        - Prices
      parameters:
        - in: query
          name: brandId
          required: true
          schema:
            type: integer
          description: |
            Brand identifier. Bound via `@RequestParam("brandId") int brandId`
            (`PriceController.java:24`). A non-numeric value produces
            `MethodArgumentTypeMismatchException`, returned as the `SpringDefaultError` shape
            with HTTP 400 (verified empirically; see the `400` response below).
          example: 1
        - in: query
          name: productId
          required: true
          schema:
            type: integer
          description: |
            Product identifier. Bound via `@RequestParam("productId") int productId`
            (`PriceController.java:25`). Same non-numeric-value behavior as `brandId`.
          example: 35455
        - in: query
          name: applicationDate
          required: true
          schema:
            type: string
          description: |
            The point in time to resolve a price for, formatted `yyyy-MM-dd HH:mm:ss`
            (parsed with `DateTimeFormatter.ofPattern("yyyy-MM-dd HH:mm:ss")`,
            `PriceController.java:28`). This is **not** ISO-8601 (no `T` separator, no timezone).
            A value that does not match this exact pattern raises `DateTimeParseException`,
            returned as the `SpringDefaultError` shape with HTTP 500 (verified empirically; see
            the `500` response below).
          example: "2020-06-14 10:00:00"
      responses:
        "200":
          description: |
            A matching price was found. Verified live response body (running instance of this
            exact code, `GET /api/price?brandId=1&productId=35455&applicationDate=2020-06-14 10:00:00`):
            `{"brandId":1,"startDate":"2020-06-14T00:00:00","endDate":"2020-12-31T23:59:59","productId":35455,"priceList":1,"priority":0,"price":35.5,"curr":"EUR"}`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceModel"
        "400":
          description: |
            A query parameter declared as `int` (`brandId` or `productId`) received a non-numeric
            value, raising `MethodArgumentTypeMismatchException`. Returned as
            `SpringDefaultError`, **not** the custom `Error` schema — verified empirically against
            a locally running instance of this exact code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpringDefaultError"
        "404":
          description: |
            No price row matches the given `brandId`, `productId`, and `applicationDate`.
            `PriceServiceImpl.searchPriceToApply` throws `NoPriceFoundException`
            (`src/main/java/com/llandaeta/prices/core/services/impl/PriceServiceImpl.java:30`),
            an `HttpException` subtype mapped to HTTP 404 by
            `HttpErrorHandler.handleHttpError`. Verified live response body:
            `{"httpcode":404,"message":"No  price found to the brand"}` — the double space and
            "to the brand" wording is an existing defect in the source string, reproduced here
            faithfully rather than corrected; see
            [`docs/backend-standards.md`](./backend-standards.md#known-risks-and-defects).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: |
            A method other than `GET` was used against `/api/price` (only `@GetMapping` is
            declared, `PriceController.java:23`), raising
            `HttpRequestMethodNotSupportedException`. Returned as `SpringDefaultError`, **not**
            the custom `Error` schema — verified empirically against a locally running instance
            of this exact code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpringDefaultError"
        "500":
          description: |
            `applicationDate` did not match the expected `yyyy-MM-dd HH:mm:ss` pattern, raising
            `DateTimeParseException` at `PriceController.java:28`
            (`LocalDateTime.parse(applicationDate, DateTimeFormatter.ofPattern("yyyy-MM-dd HH:mm:ss"))`).
            Returned as `SpringDefaultError`, **not** the custom `Error` schema, because
            `HttpErrorHandler.unhandledExceptions` cannot actually receive this exception (see
            the top-level error-contract note above). Verified empirically against a locally
            running instance of this exact code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpringDefaultError"

components:
  schemas:
    PriceModel:
      type: object
      description: |
        The API-facing price representation, returned by
        `PriceEntityModelConverter.convert`
        (`src/main/java/com/llandaeta/prices/core/converters/PriceEntityModelConverter.java:11-24`)
        from the persisted `PriceEntity`
        (`src/main/java/com/llandaeta/prices/db/entities/PriceEntity.java:14-48`), omitting `id`.
        Field definitions:
        `src/main/java/com/llandaeta/prices/core/model/PriceModel.java:9-23`.
      properties:
        brandId:
          type: integer
          example: 1
        startDate:
          type: string
          format: date-time
          description: ISO-8601 local date-time (no timezone offset), e.g. "2020-06-14T00:00:00".
          example: "2020-06-14T00:00:00"
        endDate:
          type: string
          format: date-time
          example: "2020-12-31T23:59:59"
        productId:
          type: integer
          example: 35455
        priceList:
          type: integer
          description: Identifies which price list/rate the matched row belongs to.
          example: 1
        priority:
          type: integer
          description: Tie-breaker among overlapping validity windows; higher wins.
          example: 0
        price:
          type: number
          format: double
          description: |
            The price amount. The underlying column is `DECIMAL(4,2)`
            (`src/main/resources/db/migration/V1_create_tables.sql:12`), so values at or above
            100.00 cannot currently be stored — see
            [`docs/data-model.md`](./data-model.md#known-risks-and-defects).
          example: 35.5
        curr:
          type: string
          description: ISO-4217-shaped currency code (e.g. "EUR").
          example: "EUR"
      required:
        - brandId
        - startDate
        - endDate
        - productId
        - priceList
        - priority
        - price
        - curr

    Error:
      type: object
      description: |
        The project's custom error DTO, produced only for `HttpException` subtypes by
        `HttpErrorHandler.handleHttpError`
        (`src/main/java/com/llandaeta/prices/rest/exception/HttpErrorHandler.java:15-22`).
        Definition: `src/main/java/com/llandaeta/prices/rest/dto/Error.java:6-11`.
      properties:
        httpcode:
          type: integer
          example: 404
        message:
          type: string
          example: "No  price found to the brand"
      required:
        - httpcode
        - message

    SpringDefaultError:
      type: object
      description: |
        Spring Boot's default Whitelabel error body, produced for any exception that is not an
        `HttpException` subtype, because `HttpErrorHandler.unhandledExceptions`
        (`src/main/java/com/llandaeta/prices/rest/exception/HttpErrorHandler.java:24-25`) is
        declared with a parameter type (`HttpException`) that does not match its
        `@ExceptionHandler(Exception.class)` annotation target, making it unreachable for these
        cases. Verified empirically (locally running instance of this exact code, 2026-08-19)
        for malformed `applicationDate` (500), non-numeric `brandId`/`productId` (400), and an
        unsupported HTTP method (405). This is a documented defect, not an intentional contract —
        see [`docs/backend-standards.md`](./backend-standards.md#known-risks-and-defects).
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        trace:
          type: string
          description: Full Java stack trace. Exposed by Spring Boot's default error handling in this configuration.
        message:
          type: string
        path:
          type: string
      required:
        - timestamp
        - status
        - error
        - message
        - path
