openapi: 3.0.0
info:
  title: app-prices-rest API
  description: |
    REST API that resolves the applicable price for a brand/product at a given point in time,
    selecting among possibly overlapping, prioritized price rules.
  version: 0.0.1-SNAPSHOT
  contact:
    name: app-prices-rest
  license:
    name: Unspecified

servers:
  - url: http://localhost:8080
    description: Local development server (default Spring Boot port; not overridden in application.yaml)

paths:
  /api/price:
    get:
      summary: Resolve the applicable price
      description: |
        Returns the price rule with the highest priority among all rules for the given brand and
        product whose [startDate, endDate] window contains applicationDate.
      tags:
        - Price
      parameters:
        - in: query
          name: brandId
          required: true
          schema:
            type: integer
          description: Brand identifier
        - in: query
          name: productId
          required: true
          schema:
            type: integer
          description: Product identifier
        - in: query
          name: applicationDate
          required: true
          schema:
            type: string
            example: "2020-06-14 16:00:00"
          description: >
            Point in time to resolve the price for, formatted as `yyyy-MM-dd HH:mm:ss`
            (not ISO-8601 — parsed with `DateTimeFormatter.ofPattern("yyyy-MM-dd HH:mm:ss")`).
            An unparsable value currently raises an unhandled `DateTimeParseException` rather than
            a structured 400 response — see the Known Risks section in `backend-standards.md`.
      responses:
        '200':
          description: The applicable price rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceModel'
        '400':
          description: >
            `brandId` or `productId` missing or not a valid integer. Spring's own parameter
            binding rejects the request before it reaches the controller, so this response does
            **not** use the `Error` schema below — it is Spring Boot's default error body
            (`{timestamp, status, error, message, path}`), not the application's structured shape.
        '404':
          description: No price rule matches the given brand, product, and date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: >
            Unexpected server error, including an unparsable `applicationDate`. The response body
            shape is **not guaranteed** to be the `Error` schema below: `HttpErrorHandler`'s
            generic handler is annotated `@ExceptionHandler(Exception.class)` but declares a
            parameter typed `HttpException`, so it cannot actually bind a non-`HttpException`
            (Spring falls back to its own default error body in that case) — see the Known Risks
            section in `backend-standards.md`. Only a thrown `HttpException` subtype reliably
            produces the `Error` shape, as the 404 case above does.

components:
  schemas:
    PriceModel:
      type: object
      description: Returned directly as the response body — there is no wrapping envelope.
      properties:
        brandId:
          type: integer
        startDate:
          type: string
          description: >
            Serialized Java `LocalDateTime` — timezone-free, ISO local date-time format
            (`yyyy-MM-ddTHH:mm:ss`). Deliberately not OpenAPI `format: date-time`, which implies an
            RFC 3339 offset/timezone this field never carries.
          example: "2020-06-14T15:00:00"
        endDate:
          type: string
          description: >
            Serialized Java `LocalDateTime` — timezone-free, ISO local date-time format
            (`yyyy-MM-ddTHH:mm:ss`). Deliberately not OpenAPI `format: date-time`, which implies an
            RFC 3339 offset/timezone this field never carries.
          example: "2020-12-31T23:59:59"
        productId:
          type: integer
        priceList:
          type: integer
          description: Identifier of the price list/tariff this rule belongs to
        priority:
          type: integer
          description: Used to break ties between overlapping rules; higher wins
        price:
          type: number
          format: double
        curr:
          type: string
          description: Currency code (e.g. EUR)
      required:
        - brandId
        - startDate
        - endDate
        - productId
        - priceList
        - priority
        - price
        - curr

    Error:
      type: object
      description: Shared error response shape (rest.dto.Error), produced by HttpErrorHandler
      properties:
        httpcode:
          type: integer
          description: HTTP status code, duplicated in the response body
        message:
          type: string
      required:
        - httpcode
        - message

tags:
  - name: Price
    description: Operations related to price resolution
